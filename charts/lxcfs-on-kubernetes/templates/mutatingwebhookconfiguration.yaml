{{- if and (not .Values.lxcfs.podMatchLabels) (not .Values.lxcfs.namespaceMatchLabels) }}
{{- fail "at least one of lxcfs.podMatchLabels or lxcfs.namespaceMatchLabels must be configured" }}
{{- end }}
{{- $secretName := printf "%s-certificate" (include "chart.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $caCert := "" }}
{{- $tlsCert := "" }}
{{- $tlsKey := "" }}
{{- if $existing }}
{{- $caCert = index $existing.data "ca.crt" }}
{{- $tlsCert = index $existing.data "tls.crt" }}
{{- $tlsKey = index $existing.data "tls.key" }}
{{- else }}
{{- $ca := genCA "lxcfs-on-kubernetes-webhook-service-ca" 3650 }}
{{- $cn := printf "%s-webhook-service" (include "chart.fullname" .) }}
{{- $dns1 := printf "%s.%s" $cn .Release.Namespace }}
{{- $dns2 := printf "%s.%s.svc" $cn .Release.Namespace }}
{{- $cert := genSignedCert $cn nil (list $dns1 $dns2) 3650 $ca }}
{{- $caCert = $ca.Cert | b64enc }}
{{- $tlsCert = $cert.Cert | b64enc }}
{{- $tlsKey = $cert.Key | b64enc }}
{{- end }}

{{- /* Code generated by make. DO NOT EDIT. */ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: '{{ include "chart.fullname" . }}-mutating-webhook-configuration'
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ $caCert | quote }}
    service:
      name: '{{ include "chart.fullname" . }}-webhook-service'
      namespace: {{ .Release.Namespace | quote }}
      path: /mount-lxcfs
  failurePolicy: Ignore
  name: club.cndoit18.lxcfs-on-kubernetes
  {{- if .Values.lxcfs.namespaceMatchLabels }}
  namespaceSelector:
    matchLabels: {{- toYaml .Values.lxcfs.namespaceMatchLabels | nindent 6 }}
  {{- end }}
  {{- if .Values.lxcfs.podMatchLabels }}
  objectSelector:
    matchLabels: {{- toYaml .Values.lxcfs.podMatchLabels | nindent 6 }}
  {{- end }}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: NoneOnDryRun
---
apiVersion: v1
kind: Secret
metadata:
  name: '{{ include "chart.fullname" . }}-certificate'
  namespace: {{ .Release.Namespace | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert | quote }}
  tls.key: {{ $tlsKey | quote }}
  ca.crt: {{ $caCert | quote }}