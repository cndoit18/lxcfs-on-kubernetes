{{- if not .Values.certManager.enabled }}
{{- $fullname := include "chart.fullname" . }}
{{- $secretName := printf "%s-certificate" $fullname }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $webhookService := printf "%s-webhook-service" $fullname }}
{{- $altNames := list (printf "%s.%s.svc" $webhookService .Release.Namespace) (printf "%s.%s.svc.cluster.local" $webhookService .Release.Namespace) }}
{{- $ca := "" }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if $existing }}
{{- /* Reuse existing cert from the cluster to keep it stable across upgrades */ -}}
{{- $ca = index $existing.data "ca.crt" }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- /* Generate a new self-signed cert on first install (10-year validity) */ -}}
{{- $cert := genSelfSignedCert $webhookService nil $altNames 3650 }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $ca = $cert.Cert | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  labels: {{- include "chart.labels" . | nindent 4 }}
  name: '{{ $secretName }}'
  namespace: {{ .Release.Namespace | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  labels: {{- include "chart.labels" . | nindent 4 }}
  name: '{{ $fullname }}-mutating-webhook-configuration'
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: '{{ $webhookService }}'
      namespace: {{ .Release.Namespace | quote }}
      path: /mount-lxcfs
    caBundle: {{ $ca }}
  failurePolicy: Ignore
  name: club.cndoit18.lxcfs-on-kubernetes
  namespaceSelector:
    matchLabels: {{- toYaml .Values.lxcfs.matchLabels | nindent 6 }}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: NoneOnDryRun
{{- end }}
