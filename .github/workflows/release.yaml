name: Release

# Release flow (both entry points converge on the same pipeline):
#   1. workflow_dispatch with a version (e.g. v0.2.9): builds the chart, creates
#      and pushes the tag, then publishes everything.
#   2. push of a v* tag: same pipeline, skipping tag creation. This ensures a
#      manually pushed tag still gets the complete release (chart .tgz asset,
#      goreleaser checksums/assets, images, helm repo index update on gh-pages).
#
# Never create GitHub releases by hand: the chart asset and the helm index
# update only happen here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. v0.2.9)
        required: true
  push:
    tags:
      - 'v*'

# Serialize release runs targeting the same version (a workflow_dispatch run
# pushes the tag, which then triggers the push-triggered run for the same
# version). Do not cancel in-flight runs.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # v0.2.9 either from the dispatch input or from the pushed tag name.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a 'v'-prefixed semver (e.g. v0.2.9), got '${VERSION}'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1

      - name: Generate Helm
        run: |
          APP_VERSION=${VERSION} make generate

      # Only create the tag for manual dispatches; when triggered by a tag push
        # the tag already exists. Use --force so re-running the workflow for an
        # existing tag (e.g. to repair a release) does not fail.
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@outlook.com"
          git commit -am 'release ${{ env.VERSION }}' || true
          git push -f origin master
          tag='${{ env.VERSION }}'
          git tag --annotate --force --message "Tag for release $tag" "$tag"
          git push --force origin "refs/tags/$tag"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest
          driver: docker-container

      - name: Docker Login
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

      - name: Run GoReleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Push Charts
        run: |
          make helm-push
        env:
          CR_TOKEN: "${{ secrets.GH_PAT }}"
