# This is an example .goreleaser.yml file with some sane defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2

builds:
  - skip: true

dockers_v2:
  - id: lxcfs-agent
    images:
    - ghcr.io/cndoit18/lxcfs-agent
    tags:
    - "{{ .Tag }}"
    - latest
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      GOLDFLAGS: -X 'github.com/cndoit18/lxcfs-on-kubernetes/version.AppVersion={{ .Version }}' -X 'github.com/cndoit18/lxcfs-on-kubernetes/version.GitCommit={{ .FullCommit }}'

    dockerfile: Dockerfile.agent
    extra_files:
      - scripts/
      
  - id: lxcfs-manager
    images:
    - ghcr.io/cndoit18/lxcfs-manager
    tags:
    - "{{ .Tag }}"
    - latest
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      GOLDFLAGS: -X 'github.com/cndoit18/lxcfs-on-kubernetes/version.AppVersion={{ .Version }}' -X 'github.com/cndoit18/lxcfs-on-kubernetes/version.GitCommit={{ .FullCommit }}'

    dockerfile: Dockerfile
    extra_files:
      - cmd/
      - pkg/
      - version/
      - go.mod
      - go.sum
      - scripts/

changelog:
  sort: asc

  filters:
    exclude:
      - "^docs:"
      - typo
      - (?i)foo

signs:
  - artifacts: checksum

release:
  draft: false
  prerelease: auto
  # When a release for this tag already exists (a re-run to repair a release,
  # or the duplicated run triggered by the tag push created via
  # workflow_dispatch), replace its assets instead of failing the upload.
  # Scope: GitHub release assets only. Re-running also re-pushes the images
  # above — including the "latest" tag — so re-releasing an older version
  # re-points "latest" back to it.
  replace_existing_artifacts: true

  extra_files:
    - glob: charts/*.tgz
